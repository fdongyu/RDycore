# This test input corresponds to toy-problems/swe_roe/ex2b.c, but uses a file
# to specify the initial conditions (and a corresponding Exodus mesh).

physics:
  flow:
    mode: swe
    well_balancing: hydrostatic_reconstruction
  sediment:
    num_classes: 1
    classes:
      - initial_fraction: 1.0
        settling_velocity: 1.e-4
        critical_deposition_shear_stress: 0.0 # disable deposition for conservative tracer transport
        density: 1600.0
    bed:
      active_layer_thickness: 0.05
      substrate_layers:
        - initial_thickness: 0.1
          concentration: 100.0
          partheniades_constant: 0.0 # disable erosion for conservative tracer transport
          critical_erosion_shear_stress: 0.1

numerics:
  spatial: fv
  temporal: euler
  riemann: roe

logging:
  level: debug

time:
  stop       : 240.0
  time_step  : 0.01
  unit       : seconds

#output:
#  format: xdmf
#  output_interval: 100


output:
  fields:
    - Height
    - MomentumX
    - MomentumY
    - SedimentConcentration0
  format: xdmf
  output_interval: 100        # 1-hr (=100 * 0.01 sec = 1 sec)
  batch_size: 240                 # 24 time slices put in a single .h5



grid:
  file: dam_break_sed_dx1.exo

# one region represents the whole domain
regions:
  - name: domain
    grid_region_id: 1

surface_composition:
  - region: domain
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        value: 0.0

initial_conditions:
  - region: domain
    flow: domain_flow_ic
    sediment: domain_sediment_ic

flow_conditions:
  - name: domain_flow_ic
    type: dirichlet
    file: dam_break_sed_dx1_IC.bin
    format: binary

sediment_conditions:
  - name: domain_sediment_ic
    type: dirichlet
    c0:
      file: dam_break_sed_dx1_IC_sed.bin
      format: binary

# we don't specify boundaries or boundary conditions, so all boundaries are
# reflecting
