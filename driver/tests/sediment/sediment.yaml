# This test input corresponds to toy-problems/swe_roe/ex2b.c, but uses a file
# to specify the initial conditions (and a corresponding Exodus mesh).

physics:
  flow:
    mode: swe
  sediment:
    num_classes: 2
    classes:
      - initial_fraction: 0.5
        settling_velocity: 5.e-4
        critical_deposition_shear_stress: 0.08
        density: 1400.0
      - initial_fraction: 0.5
        settling_velocity: 1.e-2
        critical_deposition_shear_stress: 0.12
        density: 2650.0
    bed:
      active_layer_thickness: 0.05
      substrate_layers:
        - initial_thickness: 0.1
          concentration: 100.0
          partheniades_constant: 4.e-6
          critical_erosion_shear_stress: 0.25
        - initial_thickness: 0.1
          concentration: 300.0
          partheniades_constant: 1.6e-5
          critical_erosion_shear_stress: 0.2

numerics:
  spatial: fv
  temporal: euler
  riemann: roe

logging:
  level: debug

time:
  stop: 1.00
  time_step : 0.01
  unit: seconds

#output:
#  format: xdmf
#  output_interval: 100

grid:
  file: DamBreak_grid5x10.exo

# one region represents the whole domain
regions:
  - name: domain
    grid_region_id: 1

surface_composition:
  - region: domain
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        file: manning_grid5x10.${PETSC_ID_TYPE}.bin
        format: binary

initial_conditions:
  - region: domain
    flow: domain_flow_ic
    sediment: domain_sediment_ic

flow_conditions:
  - name: domain_flow_ic
    type: dirichlet
    file: DamBreak_grid5x10_wetdownstream.ic.${PETSC_ID_TYPE}.bin
    format: binary

sediment_conditions:
  - name: domain_sediment_ic
    type: dirichlet
    c0:
      value: 0.1
    c1:
      value: 0.2

# we don't specify boundaries or boundary conditions, so all boundaries are
# reflecting
